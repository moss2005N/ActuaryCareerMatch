name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENVIRONMENT: test
      DEBUG: "False"
      SECRET_KEY: django-insecure-ci-only-not-used-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: sqlite
      SQLITE_NAME: ci.sqlite3
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: tests@example.invalid
      PHONE_VERIFICATION_BACKEND: console

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check

      - name: Run test suite
        run: python manage.py test

      - name: Check whitespace errors
        run: git diff --check
